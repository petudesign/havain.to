<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Havain · Maintenance centre</title>
<meta name="description" content="Havain maintenance centre demo: a department map built from shelf captures, shelf front views with vision overlays, alerts and a review queue. Simulated store.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">Havain</span><span class="brand-sub">Maintenance centre</span></div>
    <div class="store"><span class="store-name">Demo store</span><span class="dot" aria-hidden="true">·</span><span>Dairy and chilled</span></div>
    <div class="top-right">
      <span class="sim" title="Everything on this page is simulated">Simulated store</span>
      <span id="today" class="today"></span>
      <span class="user" aria-label="Signed in as department manager"><span class="avatar" aria-hidden="true">DM</span>Department manager</span>
    </div>
  </header>
  <nav class="side" aria-label="Sections">
    <a href="#map" data-view="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z M9 3v15 M15 6v15"/></svg><span>Map</span></a>
    <a href="#review" data-view="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z M8 9h8 M8 12h5"/></svg><span>Review</span><b id="review-count" class="badge"></b></a>
    <a href="#captures" data-view="captures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Captures</span></a>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
